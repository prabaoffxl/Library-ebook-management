spring.application.name=municipal-library

# In-Memory H2 Database (Zero-Configuration Mode)
spring.datasource.url=jdbc:h2:mem:municipal_library;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# File Upload Limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# Storage Paths
storage.base-path=storage
storage.ebook-path=storage/ebooks
storage.cover-path=storage/covers
storage.preview-path=storage/previews
storage.archive-path=storage/archive

app.storage.ebooks-dir=storage/ebooks
app.storage.covers-dir=storage/covers

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# License Monitoring
license.expiry.warning-days=30
license.expiry.second-warning-days=7
license.monitoring.enabled=true
license.monitoring.cron=0 0 1 * * ?

spring.jackson.time-zone=Asia/Kolkata
ebook.preview.max-pages=10
