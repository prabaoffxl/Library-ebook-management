spring.application.name=municipal-library

# Database Configuration (supports environment variables DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/municipal_library?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Limits (Configurable up to 100MB for Version 5 DAM)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# Digital Asset Management Storage Directory Properties
storage.base-path=storage
storage.ebook-path=storage/ebooks
storage.cover-path=storage/covers
storage.preview-path=storage/previews
storage.archive-path=storage/archive

# Legacy App Storage Paths
app.storage.ebooks-dir=storage/ebooks
app.storage.covers-dir=storage/covers

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# License Management Configuration
license.expiry.warning-days=30
license.expiry.second-warning-days=7
license.monitoring.enabled=true
license.monitoring.cron=0 0 1 * * ?

# Timezone Configuration
spring.jackson.time-zone=Asia/Kolkata

# E-Book Online Reading & Preview Configuration
ebook.preview.max-pages=10

